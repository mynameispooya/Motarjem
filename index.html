<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مترجم هوشمند زیرنویس و متن | Groq</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --success: #10b981;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Vazirmatn", "Tahoma", system-ui, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.7;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 1.9rem;
      background: linear-gradient(90deg, #a5b4fc, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-number {
      background: var(--primary);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: bold;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    input[type="password"],
    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 14px 16px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    input[type="file"] {
      padding: 12px;
      cursor: pointer;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 16px;
    }

    .btn:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-success {
      background: var(--success);
    }

    .btn-success:hover:not(:disabled) {
      background: #059669;
    }

    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      display: none;
    }

    .status.success {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: block;
    }

    .status.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: block;
    }

    .status.info {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      display: block;
    }

    /* Progress */
    .progress-container {
      display: none;
      margin-top: 24px;
    }

    .progress-bar-bg {
      height: 14px;
      background: #0f172a;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #a855f7);
      border-radius: 20px;
      transition: width 0.4s ease;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .file-info {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
      display: none;
    }

    .hidden {
      display: none !important;
    }

    .log-box {
      margin-top: 20px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: var(--muted);
      display: none;
    }

    .log-box div {
      margin-bottom: 4px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>مترجم هوشمند زیرنویس و متن</h1>
      <p>با قدرت Groq • ترجمه حرفه‌ای به فارسی ساده و روان</p>
    </header>

    <!-- مرحله ۱: API Key -->
    <div class="card" id="apiCard">
      <h2><span class="step-number">۱</span> اتصال به Groq</h2>
      <label for="apiKey">کلید API گروک (Groq API Key)</label>
      <input type="password" id="apiKey" placeholder="gsk_xxxxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
      <button class="btn" id="connectBtn" onclick="connectApi()">اتصال و شروع</button>
      <div class="status" id="apiStatus"></div>
    </div>

    <!-- مرحله ۲: آپلود فایل -->
    <div class="card hidden" id="uploadCard">
      <h2><span class="step-number">۲</span> آپلود فایل</h2>
      <label for="fileInput">فایل زیرنویس یا متن (SRT / VTT / TXT)</label>
      <input type="file" id="fileInput" accept=".srt,.vtt,.txt,text/plain" />
      <div class="file-info" id="fileInfo"></div>
      <button class="btn" id="translateBtn" onclick="startTranslation()" disabled>
        شروع ترجمه
      </button>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="progress-text">
          <span id="progressPercent">۰٪</span>
          <span id="progressDetail">آماده...</span>
        </div>
      </div>

      <div class="log-box" id="logBox"></div>
      <div class="status" id="translateStatus"></div>
    </div>

    <!-- مرحله ۳: دانلود -->
    <div class="card hidden" id="downloadCard">
      <h2><span class="step-number">۳</span> دانلود فایل ترجمه‌شده</h2>
      <p style="color:var(--muted); margin-bottom:16px;">ترجمه با موفقیت انجام شد. فایل آماده دانلود است.</p>
      <button class="btn btn-success" id="downloadBtn" onclick="downloadFile()">
        دانلود فایل ترجمه‌شده
      </button>
    </div>

    <footer>
      ساخته‌شده با HTML + CSS + JavaScript • استفاده از مدل‌های Groq
    </footer>
  </div>

  <script>
    // ==================== تنظیمات ====================
    const GROQ_API_URL = "https://api.groq.com/openai/v1/chat/completions";
    const MODEL = "llama-3.3-70b-versatile"; // مدل قوی و مناسب ترجمه
    const CHUNK_SIZE = 12;                   // تعداد خطوط متنی در هر قطعه
    const DELAY_MS = 1800;                   // تأخیر بین درخواست‌ها (میلی‌ثانیه) برای جلوگیری از rate-limit

    // پرامپت حرفه‌ای ترجمه
    const SYSTEM_PROMPT = `تو یک مترجم کاملاً حرفه‌ای، کاربلد و باتجربه هستی.
وظیفه تو این است که متن داده‌شده را به زبان فارسی ساده، روان، سلیس و کاملاً گویا ترجمه کنی.
ترجمه باید طوری باشد که هر فارسی‌زبانی (حتی با سطح متوسط) به‌راحتی آن را بفهمد.
از زبان ادبی سنگین، کلمات پیچیده یا ترجمه‌های تحت‌اللفظی خشک خودداری کن.
معنی را دقیق حفظ کن، اما با بیان طبیعی و محاوره‌ایِ مناسبِ زیرنویس یا متن عمومی بنویس.
فقط متن ترجمه‌شده را برگردان و هیچ توضیح اضافی نده.`;

    // ==================== متغیرهای سراسری ====================
    let apiKey = "";
    let originalFileName = "";
    let originalExtension = "";
    let parsedBlocks = [];          // برای srt/vtt
    let plainTextChunks = [];       // برای txt
    let translatedResult = "";
    let isConnected = false;

    // ==================== توابع کمکی ====================
    function showStatus(elementId, message, type = "info") {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = `status ${type}`;
    }

    function log(msg) {
      const box = document.getElementById("logBox");
      box.style.display = "block";
      const div = document.createElement("div");
      div.textContent = `• ${msg}`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function updateProgress(current, total) {
      const percent = Math.round((current / total) * 100);
      document.getElementById("progressBar").style.width = percent + "%";
      document.getElementById("progressPercent").textContent = percent + "٪";
      document.getElementById("progressDetail").textContent = `${current} از ${total} قطعه`;
    }

    // ==================== اتصال API ====================
    async function connectApi() {
      const key = document.getElementById("apiKey").value.trim();
      if (!key) {
        showStatus("apiStatus", "لطفاً کلید API را وارد کنید.", "error");
        return;
      }

      const btn = document.getElementById("connectBtn");
      btn.disabled = true;
      btn.textContent = "در حال اتصال...";

      try {
        // تست ساده اتصال
        const res = await fetch(GROQ_API_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${key}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [{ role: "user", content: "سلام" }],
            max_tokens: 10
          })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error?.message || `خطای ${res.status}`);
        }

        apiKey = key;
        isConnected = true;
        showStatus("apiStatus", "اتصال با موفقیت برقرار شد ✓", "success");
        document.getElementById("uploadCard").classList.remove("hidden");
        document.getElementById("apiKey").disabled = true;
        btn.textContent = "متصل شد";
      } catch (e) {
        showStatus("apiStatus", "خطا در اتصال: " + e.message, "error");
        btn.disabled = false;
        btn.textContent = "اتصال و شروع";
      }
    }

    // ==================== پارس فایل ====================
    document.getElementById("fileInput").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;

      originalFileName = file.name;
      const ext = file.name.split(".").pop().toLowerCase();
      originalExtension = ext;

      if (!["srt", "vtt", "txt"].includes(ext)) {
        showStatus("translateStatus", "فرمت فایل پشتیبانی نمی‌شود. فقط SRT، VTT یا TXT.", "error");
        document.getElementById("translateBtn").disabled = true;
        return;
      }

      const reader = new FileReader();
      reader.onload = function (ev) {
        const content = ev.target.result;
        document.getElementById("fileInfo").style.display = "block";
        document.getElementById("fileInfo").textContent = `فایل انتخاب‌شده: \( {file.name} ( \){(file.size / 1024).toFixed(1)} KB)`;

        if (ext === "txt") {
          parseTxt(content);
        } else {
          parseSubtitle(content, ext);
        }

        document.getElementById("translateBtn").disabled = false;
        showStatus("translateStatus", "فایل آماده ترجمه است. روی دکمه شروع کلیک کنید.", "info");
      };
      reader.readAsText(file, "UTF-8");
    });

    function parseTxt(content) {
      // تقسیم متن به پاراگراف‌ها یا جملات نسبتاً کوتاه
      const paragraphs = content
        .split(/\n\s*\n/)
        .map(p => p.trim())
        .filter(p => p.length > 0);

      plainTextChunks = [];
      let current = "";
      for (const p of paragraphs) {
        if ((current + "\n\n" + p).length > 900) {
          if (current) plainTextChunks.push(current);
          current = p;
        } else {
          current = current ? current + "\n\n" + p : p;
        }
      }
      if (current) plainTextChunks.push(current);

      // اگر خیلی کم بود، تکه‌های کوچک‌تر بساز
      if (plainTextChunks.length === 0 && content.trim()) {
        plainTextChunks = [content.trim()];
      }

      log(`فایل متنی به ${plainTextChunks.length} قطعه تقسیم شد.`);
    }

    function parseSubtitle(content, ext) {
      parsedBlocks = [];
      const lines = content.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      let i = 0;

      // رد کردن هدر VTT
      if (ext === "vtt" && lines[0]?.startsWith("WEBVTT")) {
        while (i < lines.length && lines[i].trim() !== "") i++;
        i++; // خط خالی بعد از هدر
      }

      while (i < lines.length) {
        // رد کردن خطوط خالی
        while (i < lines.length && lines[i].trim() === "") i++;
        if (i >= lines.length) break;

        let index = null;
        let timeLine = "";
        let textLines = [];

        // شماره (اختیاری در VTT)
        if (/^\d+$/.test(lines[i].trim())) {
          index = lines[i].trim();
          i++;
        }

        // خط تایم
        if (i < lines.length && lines[i].includes("-->")) {
          timeLine = lines[i].trim();
          i++;
        } else {
          // اگر تایم نبود، رد شو
          i++;
          continue;
        }

        // متن‌ها
        while (i < lines.length && lines[i].trim() !== "") {
          textLines.push(lines[i]);
          i++;
        }

        if (timeLine) {
          parsedBlocks.push({
            index,
            time: timeLine,
            text: textLines.join("\n").trim()
          });
        }
      }

      log(`تعداد بلوک‌های زیرنویس: ${parsedBlocks.length}`);
    }

    // ==================== ترجمه ====================
    async function startTranslation() {
      if (!isConnected) {
        showStatus("translateStatus", "ابتدا به API متصل شوید.", "error");
        return;
      }

      const btn = document.getElementById("translateBtn");
      btn.disabled = true;
      btn.textContent = "در حال ترجمه...";

      document.getElementById("progressContainer").style.display = "block";
      document.getElementById("logBox").style.display = "block";
      document.getElementById("downloadCard").classList.add("hidden");
      translatedResult = "";

      try {
        if (originalExtension === "txt") {
          await translateTxt();
        } else {
          await translateSubtitle();
        }

        showStatus("translateStatus", "ترجمه با موفقیت به پایان رسید ✓", "success");
        document.getElementById("downloadCard").classList.remove("hidden");
        btn.textContent = "ترجمه مجدد";
        btn.disabled = false;
      } catch (e) {
        showStatus("translateStatus", "خطا در ترجمه: " + e.message, "error");
        log("خطا: " + e.message);
        btn.disabled = false;
        btn.textContent = "شروع ترجمه";
      }
    }

    async function callGroq(text) {
      const response = await fetch(GROQ_API_URL, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: MODEL,
          messages: [
            { role: "system", content: SYSTEM_PROMPT },
            { role: "user", content: text }
          ],
          temperature: 0.3,
          max_tokens: 2048
        })
      });

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(errData.error?.message || `HTTP ${response.status}`);
      }

      const data = await response.json();
      return data.choices[0].message.content.trim();
    }

    async function translateTxt() {
      const total = plainTextChunks.length;
      const results = [];

      for (let i = 0; i < total; i++) {
        updateProgress(i, total);
        log(`ترجمه قطعه ${i + 1} از ${total}...`);

        const translated = await callGroq(plainTextChunks[i]);
        results.push(translated);

        if (i < total - 1) {
          log(`انتظار ${DELAY_MS / 1000} ثانیه برای جلوگیری از محدودیت...`);
          await sleep(DELAY_MS);
        }
      }

      updateProgress(total, total);
      translatedResult = results.join("\n\n");
    }

    async function translateSubtitle() {
      // فقط متن‌ها را استخراج و به قطعات تقسیم کن
      const texts = parsedBlocks.map(b => b.text);
      const chunks = [];
      for (let i = 0; i < texts.length; i += CHUNK_SIZE) {
        chunks.push(texts.slice(i, i + CHUNK_SIZE));
      }

      const totalChunks = chunks.length;
      const translatedTexts = [];

      for (let c = 0; c < totalChunks; c++) {
        updateProgress(c, totalChunks);
        log(`ترجمه قطعه ${c + 1} از \( {totalChunks} ( \){chunks[c].length} خط)...`);

        // ساخت ورودی شماره‌دار برای حفظ ترتیب
        const input = chunks[c]
          .map((t, idx) => `[\( {idx + 1}]\n \){t}`)
          .join("\n\n");

        const raw = await callGroq(input);

        // پارس خروجی
        const parts = raw.split(/\[\d+\]/).map(p => p.trim()).filter(p => p);
        // اگر تعداد کم بود، سعی می‌کنیم با \n\n جدا کنیم
        let finalParts = parts.length >= chunks[c].length
          ? parts.slice(0, chunks[c].length)
          : raw.split(/\n\s*\n/).map(p => p.trim()).filter(p => p);

        // اطمینان از تعداد درست
        while (finalParts.length < chunks[c].length) {
          finalParts.push(chunks[c][finalParts.length] || "");
        }

        translatedTexts.push(...finalParts.slice(0, chunks[c].length));

        if (c < totalChunks - 1) {
          log(`انتظار ${DELAY_MS / 1000} ثانیه...`);
          await sleep(DELAY_MS);
        }
      }

      updateProgress(totalChunks, totalChunks);

      // بازسازی فایل
      let output = "";
      if (originalExtension === "vtt") {
        output = "WEBVTT\n\n";
      }

      parsedBlocks.forEach((block, i) => {
        if (block.index !== null) {
          output += block.index + "\n";
        }
        output += block.time + "\n";
        output += (translatedTexts[i] || block.text) + "\n\n";
      });

      translatedResult = output.trim() + "\n";
    }

    // ==================== دانلود ====================
    function downloadFile() {
      if (!translatedResult) return;

      const blob = new Blob([translatedResult], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;

      const baseName = originalFileName.replace(/\.[^/.]+$/, "");
      a.download = `\( {baseName}_fa. \){originalExtension}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      log("فایل دانلود شد.");
    }
  </script>
</body>
</html>
